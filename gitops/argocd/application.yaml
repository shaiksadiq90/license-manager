# Argo CD watches this repo and keeps the cluster in sync with the Helm chart + dev values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: license-manager-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shaiksadiq90/license-manager.git
    targetRevision: main
    path: k8s/helm/license-manager
    helm:
      valueFiles: [../../../gitops/envs/dev/values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: license-manager
  syncPolicy:
    automated:
      prune: true      # remove what was deleted from git
      selfHeal: true   # undo manual changes made with kubectl
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
