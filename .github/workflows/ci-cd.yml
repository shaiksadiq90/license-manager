name: ci-cd
on:
  pull_request:
  push: { branches: [main] }
permissions: { id-token: write, contents: read }   # OIDC to AWS, no long-lived keys
env:
  AWS_REGION: us-east-1
  CLUSTER: license-manager-dev
  # Push + deploy only run once the repo variable AWS_DEPLOY_ENABLED=true is set
  DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform/envs/dev } }
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false && terraform validate
      - run: cd ../../bootstrap && terraform init -backend=false && terraform validate

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: helm lint k8s/helm/license-manager
      - run: helm lint k8s/helm/license-manager -f k8s/helm/license-manager/values-local.yaml
      - run: helm lint k8s/helm/license-manager -f gitops/envs/dev/values.yaml
      - run: helm template lm k8s/helm/license-manager -f k8s/helm/license-manager/values-local.yaml > rendered.yaml && grep -c "^kind:" rendered.yaml

  build-scan:
    needs: [test, terraform, helm]
    runs-on: ubuntu-latest
    strategy: { matrix: { svc: [api, web] } }
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: |
          DIR=$([ "${{ matrix.svc }}" = api ] && echo backend || echo frontend)
          docker build -t license-manager-${{ matrix.svc }}:${{ github.sha }} $DIR
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: license-manager-${{ matrix.svc }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Report Trivy findings as annotations
        if: failure()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image -q \
            --severity HIGH,CRITICAL --ignore-unfixed --format json license-manager-${{ matrix.svc }}:${{ github.sha }} > trivy.json || true
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | "::error title=\(.VulnerabilityID) \(.Severity)::\($t) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"' trivy.json | sort -u | head -50
      - name: Push to ECR
        if: env.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - id: ecr
        if: env.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2
      - if: env.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/license-manager-${{ matrix.svc }}:${{ github.sha }}
          docker tag license-manager-${{ matrix.svc }}:${{ github.sha }} $IMG
          docker push $IMG

  # GitOps: CI never touches the cluster. It records the new image in git; Argo CD deploys it.
  gitops-update:
    needs: build-scan
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions: { id-token: write, contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Point dev at the new images
        env: { REG: "${{ steps.ecr.outputs.registry }}", TAG: "${{ github.sha }}" }
        run: |
          F=gitops/envs/dev/values.yaml
          yq -i '.image.api.repository = strenv(REG) + "/license-manager-api" | .image.api.tag = strenv(TAG)' $F
          yq -i '.image.web.repository = strenv(REG) + "/license-manager-web" | .image.web.tag = strenv(TAG)' $F
          git diff --stat
      - name: Commit (Argo CD picks it up within ~3 minutes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): ${GITHUB_SHA::7}" && git push || echo "nothing to deploy"
