name: ci-cd
on:
  pull_request:
  push: { branches: [main] }
permissions: { id-token: write, contents: read }   # OIDC to AWS, no long-lived keys
env:
  AWS_REGION: us-east-1
  CLUSTER: license-manager-dev
  # Push + deploy only run once the repo variable AWS_DEPLOY_ENABLED=true is set
  DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform/envs/dev } }
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false && terraform validate

  build-scan:
    needs: [test, terraform]
    runs-on: ubuntu-latest
    strategy: { matrix: { svc: [api, web] } }
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: |
          DIR=$([ "${{ matrix.svc }}" = api ] && echo backend || echo frontend)
          docker build -t license-manager-${{ matrix.svc }}:${{ github.sha }} $DIR
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: license-manager-${{ matrix.svc }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Push to ECR
        if: env.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - id: ecr
        if: env.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2
      - if: env.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/license-manager-${{ matrix.svc }}:${{ github.sha }}
          docker tag license-manager-${{ matrix.svc }}:${{ github.sha }} $IMG
          docker push $IMG

  deploy:
    needs: build-scan
    if: vars.AWS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ secrets.AWS_DEPLOY_ROLE_ARN }}", aws-region: "${{ env.AWS_REGION }}" }
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - run: aws eks update-kubeconfig --name $CLUSTER --region $AWS_REGION
      - name: Helm deploy (auto-rollback on failure)
        run: |
          helm upgrade --install license-manager k8s/helm/license-manager \
            --set image.api.repository=${{ steps.ecr.outputs.registry }}/license-manager-api \
            --set image.web.repository=${{ steps.ecr.outputs.registry }}/license-manager-web \
            --set image.api.tag=${{ github.sha }} --set image.web.tag=${{ github.sha }} \
            --atomic --wait --timeout 5m
