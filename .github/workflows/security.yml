name: security-and-load
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, security-events: write }

jobs:
  # SAST: scan source from the inside, before anything runs
  sast-semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: Semgrep (fail on ERROR-severity findings)
        run: |
          semgrep scan --config p/typescript --config p/nodejs --config p/react \
            --config p/dockerfile --config p/terraform --config p/kubernetes \
            --severity ERROR --error --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif, category: semgrep }

  # DAST + load: scan the running stack from the outside
  dast-and-load:
    needs: sast-semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start stack (db, api, web)
        run: |
          docker compose up -d --build db api web
          for i in $(seq 1 30); do curl -fs localhost:3000/readyz && break; sleep 2; done
      - name: OWASP ZAP API scan against the OpenAPI spec
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: loadtest/openapi.yaml
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: "-O http://localhost:3000"
          allow_issue_writing: false
          artifact_name: zap-api-report
      - name: OWASP ZAP baseline scan of the web UI
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          artifact_name: zap-web-report
      - name: Locust load test (SLO gate: p95 < 500 ms, errors < 1%)
        run: |
          pip install -q locust==2.32.4
          locust -f loadtest/locustfile.py --host http://localhost:3000 \
            --headless -u 50 -r 10 -t 2m --csv loadtest/results --html loadtest/report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: locust-report, path: |
            loadtest/results*
            loadtest/report.html }
      - if: always()
        run: docker compose logs api | tail -100
