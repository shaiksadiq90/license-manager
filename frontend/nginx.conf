server {
  listen 8080;
  server_tokens off;                                   # don't advertise the nginx version
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ { proxy_pass http://api:3000; }
  location / { try_files $uri /index.html; }
}
